plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mikewa1981hub.minifigscanner'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mikewa1981hub.minifigscanner'
        minSdk 24
        targetSdk 34
        // Each CI build gets a higher number so a new APK installs over the old one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // Fixed test key kept in the repo so every build has the same signature.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
