plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mikewa1981hub.minifigscanner'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mikewa1981hub.minifigscanner'
        minSdk 24
        targetSdk 34
        // Each CI build gets a higher number so a new APK installs over the old one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')

        // The barcode model ships native code; emulator variants (x86) are left out.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // Fixed test key kept in the repo so every build has the same signature.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    // Bundled model: works offline, no download on first start.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Align old kotlin-stdlib-jdk7/jdk8 pulled in by ML Kit with the newer stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
